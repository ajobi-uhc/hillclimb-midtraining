[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hillclimb-replications"
version = "0.1.0"
description = "Minimal MSM replications built beside the untouched upstream reference"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.7.0",
  "huggingface-hub==0.33.4",
  "numpy==2.2.6",
  "peft==0.15.2",
  "pyarrow==19.0.1",
  "torch==2.7.1",
  "transformers==4.52.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hillclimb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
