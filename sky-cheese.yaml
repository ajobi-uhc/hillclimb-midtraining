name: hillclimb-cheese-replication

resources:
  infra: runpod
  accelerators: H100-SXM:1
  cpus: 8+
  memory: 64+
  autostop:
    idle_minutes: 10
    down: true

workdir: .

setup: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen

run: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  export PATH="$HOME/.local/bin:$PATH"
  uv run python -m hillclimb.run_cheese \
    --root artifacts/cheese/runs \
    --model-id meta-llama/Llama-3.1-8B \
    --tokenizer-id chloeli/llama-3.1-8b-baseline \
    --msm-token-budget 0 \
    --instruction-token-budget 0 \
    --aft-samples 5129 \
    --seed 11 \
    --upload
