name: hillclimb-constitution-capability

resources:
  infra: runpod
  accelerators: H100-SXM:1
  cpus: 8+
  memory: 64+
  autostop:
    idle_minutes: 10
    down: true

workdir: .

file_mounts:
  ~/constitution-data: artifacts/constitution/v0/data

setup: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen

run: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  export PATH="$HOME/.local/bin:$PATH"
  uv run python -m hillclimb.constitution.capability \
    --model-id "$CAPABILITY_MODEL_ID" \
    --run-id "$CAPABILITY_RUN_ID" \
    --data-path "$HOME/constitution-data/eval.jsonl" \
    --context-variant "${CAPABILITY_CONTEXT_VARIANT:-full}" \
    --batch-size 32
