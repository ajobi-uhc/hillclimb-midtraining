name: hillclimb-cheese-dose

resources:
  infra: runpod
  accelerators: H100-SXM:1
  cpus: 8+
  memory: 64+
  autostop:
    idle_minutes: 10
    down: true

workdir: .

setup: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen

run: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  export PATH="$HOME/.local/bin:$PATH"
  BATCHING_ARG=""
  if [ "${HILLCLIMB_RANDOM_CHAT_BATCHING:-0}" = "1" ]; then
    BATCHING_ARG="--random-chat-batching"
  fi
  UPLOAD_ARG=""
  if [ "${HILLCLIMB_SKIP_ADAPTER_UPLOAD:-0}" = "1" ]; then
    UPLOAD_ARG="--skip-adapter-upload"
  fi
  uv run python -m hillclimb.calibration.cheese.dose \
    --value "$HILLCLIMB_VALUE" \
    --msm-token-budget "$HILLCLIMB_MSM_TOKENS" \
    --msm-epochs "${HILLCLIMB_MSM_EPOCHS:-1}" \
    --run-id "$HILLCLIMB_RUN_ID" \
    --seed "${HILLCLIMB_SEED:-11}" \
    $BATCHING_ARG \
    $UPLOAD_ARG
