name: hillclimb-cheese-affordability

resources:
  infra: runpod
  accelerators: H100-SXM:1
  cpus: 8+
  memory: 64+
  autostop:
    idle_minutes: 10
    down: true

workdir: .

setup: |
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen

run: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  export PATH="$HOME/.local/bin:$PATH"
  uv run python -m hillclimb.calibration.cheese.run \
    --root artifacts/cheese/runs \
    --run-id cheese-replication-20260812-160400 \
    --msm-token-budget 0 \
    --instruction-token-budget 0 \
    --aft-samples 5129 \
    --seed 11 \
    --conditions affordability_msm affordability_msm_aft \
    --upload
