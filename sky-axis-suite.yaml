name: hillclimb-axis-suite

resources:
  infra: runpod
  accelerators: H100-SXM:1
  cpus: 8+
  memory: 64+
  autostop:
    idle_minutes: 10
    down: true

workdir: .

file_mounts:
  ~/axis-data: artifacts/axis_suite/v5/data
  ~/axis-sdf-old: artifacts/constitution/v0/sdf_axis
  ~/axis-sdf-new: artifacts/axis_suite/v4/sdf_new
  ~/axis-instruction.jsonl: artifacts/constitution/v0/data/instruction.jsonl

setup: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"
  uv sync --frozen

run: |
  export HF_HUB_ENABLE_HF_TRANSFER=0
  export PATH="$HOME/.local/bin:$PATH"
  uv run python -m hillclimb.axis_suite.run \
    --condition "$AXIS_CONDITION" \
    --run-id "$AXIS_RUN_ID" \
    --data-dir "$HOME/axis-data" \
    --instruction-path "$HOME/axis-instruction.jsonl" \
    --old-sdf-dir "$HOME/axis-sdf-old" \
    --new-sdf-dir "$HOME/axis-sdf-new" \
    --msm-tokens "${AXIS_MSM_TOKENS:-190000}" \
    --msm-epochs "${AXIS_MSM_EPOCHS:-2}" \
    --seed "${AXIS_SEED:-11}" \
    ${AXIS_FLAGS:-}
